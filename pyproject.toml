[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackzero-downloader"
version = "0.1.0"
description = "Reliable HTTP/HTTPS command-line downloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]

[project.scripts]
blackzero = "blackzero.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["blackzero*"]
